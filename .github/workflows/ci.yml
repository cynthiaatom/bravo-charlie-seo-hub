name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/bravo-charlie-hub-m1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEMPORARY M1 PREPARATION GATE. Remove before merge. Vite regenerates
      # TanStack's route tree; Drizzle generates both dialect migration sets;
      # Prettier then normalizes the generated and M1 source files. The artifact
      # lets the ChatGPT GitHub workflow bring those deterministic outputs back
      # into the feature branch before final verification.
      - name: Generate route tree
        run: pnpm vite build

      - name: Generate database migrations
        run: pnpm run db:generate

      - name: Format generated outputs
        run: pnpm run format:write

      - name: Upload M1 generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: bravo-charlie-m1-generated
          if-no-files-found: error
          retention-days: 7
          path: |
            src/routeTree.gen.ts
            src/bcseo
            src/client/components/Sidebar.tsx
            src/client/navigation/items.ts
            src/db/bravo-charlie.schema.ts
            src/db/bravo-charlie-schema-parity.test.ts
            src/db/pg/bravo-charlie.schema.ts
            src/routes/_app/clients.tsx
            src/routes/api/wp
            src/server/features/bravo-charlie
            src/serverFunctions/bravo-charlie.ts
            src/types/schemas/bravo-charlie.ts
            docs/bravo-charlie-hub-m1.md
            drizzle
            drizzle-pg

      - name: Run CI checks
        run: pnpm run ci:check

      - name: Run tests
        run: pnpm run test:ci

      # Runs the leanWorkerBundle generateBundle assertion: fails if a
      # denylisted package (dataforseo-client, autumn-js, ...) re-enters the
      # worker's eager startup graph. See vite-plugin-lean-worker-bundle.ts.
      - name: Build worker (eager-bundle guard)
        run: pnpm vite build

      - name: Install website dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run website type checks
        run: pnpm --dir web run types:check

      - name: Build website
        run: pnpm --dir web run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build self-host Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
